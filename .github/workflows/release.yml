name: release

concurrency:
  group: release
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific tag to release (e.g. v0.4.0). Empty = backfill all missing.'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Release gate: runs ONLY on tag pushes. A release is published strictly
  # after every check is green: version hygiene → full test suite →
  # built-container live e2e → Trivy. Failing gate = no release.
  # ---------------------------------------------------------------------------
  gate:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates to Ubuntu 26 in Oct 2026
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check (app + bot scripts)
        run: for f in server.js lib/*.js scripts/*.mjs; do node --check "$f"; done

      - name: Release hygiene (tag ↔ package.json ↔ APP_VERSION ↔ Dockerfile ↔ CHANGELOG)
        run: node scripts/release_hygiene.mjs --tag "$GITHUB_REF_NAME"

      - name: Full test suite
        run: |
          set -o pipefail
          node --test --test-concurrency=1 test/*.test.js 2>&1 | tee /tmp/test-out.txt | grep -E '^(ok|not ok|# (tests|pass|fail|cancelled))' || true
          if grep -Eq '^\s*not ok' /tmp/test-out.txt; then
            grep -E '^\s*not ok' -A12 /tmp/test-out.txt | head -80 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Build release image
        uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: advarr:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Live e2e of the built artifact inside an isolated docker network:
      #   advarr-main  — image under test (no auth)
      #   advarr-auth  — same image, env-seeded Basic-Auth
      #   advarr-stub  — local Radarr/Sonarr stubs (release_e2e.mjs --stub)
      #   advarr-e2e-run — probe runner (release_e2e.mjs), ephemeral
      - name: Live e2e (container artifact)
        run: |
          docker network create advarr-e2e
          trap 'docker rm -f advarr-main advarr-auth advarr-stub >/dev/null 2>&1; docker network rm advarr-e2e >/dev/null 2>&1' EXIT
          docker run -d --name advarr-main --network advarr-e2e advarr:release
          docker run -d --name advarr-auth --network advarr-e2e \
            -e BASIC_AUTH_USER=e2e-user -e BASIC_AUTH_PASS=e2e-pass-9 advarr:release
          docker run -d --name advarr-stub --network advarr-e2e \
            -v "$PWD/scripts:/s:ro" --entrypoint node advarr:release /s/release_e2e.mjs --stub
          for c in advarr-main advarr-auth; do
            for i in $(seq 1 30); do
              docker exec "$c" wget -qO- http://127.0.0.1:8787/api/v1/health >/dev/null 2>&1 && break
              sleep 1
            done
            docker exec "$c" wget -qO- http://127.0.0.1:8787/api/v1/health
          done
          docker run --rm --name advarr-e2e-run --network advarr-e2e \
            -v "$PWD/scripts:/s:ro" --entrypoint node \
            -e E2E_BASE=http://advarr-main:8787 \
            -e E2E_AUTH_BASE=http://advarr-auth:8787 \
            -e E2E_STUB_HOST=advarr-stub \
            -e E2E_EXPECT_VERSION="${GITHUB_REF_NAME#v}" \
            advarr:release /s/release_e2e.mjs

      - name: Trivy security scan (report)
        # pinned by commit SHA (v0.36.0); tags like @0.28.0 no longer resolve
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: advarr:release
          format: json
          output: /tmp/trivy.json
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: '0'

      - name: Enforce trivy results (annotate + fail)
        run: |
          echo "## Trivy (HIGH/CRITICAL, unfixed) — advarr:release" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)\t\(.FixedVersion // "unfixed")"' \
            /tmp/trivy.json | tee /tmp/findings.txt | sed 's/^/  /' >> "$GITHUB_STEP_SUMMARY" || true
          N=$(wc -l < /tmp/findings.txt)
          if [ "$N" -gt 0 ]; then
            while IFS=$'\t' read -r sev cve pkg inst fixed; do
              echo "::error::Trivy $sev: $cve — $pkg ($inst → $fixed)"
            done < /tmp/findings.txt
            exit 1
          fi
          echo "✅ no HIGH/CRITICAL unfixed findings" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Publish: GitHub Releases from CHANGELOG notes. On tags — only after the
  # gate is green; on plain main pushes — backfill of missing releases (fast path).
  # ---------------------------------------------------------------------------
  publish:
    needs: [gate]
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan releases
        id: plan
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tags=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tags=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # backfill: every tag without a release, oldest first
            TAGS=""
            for t in $(git tag -l 'v*' --sort=version:refname); do
              if ! gh release view "$t" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                TAGS="$TAGS $t"
              fi
            done
            echo "tags=${TAGS# }" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create releases (notes from CHANGELOG)
        if: steps.plan.outputs.tags != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for TAG in ${{ steps.plan.outputs.tags }}; do
            # race guard: another workflow (main backfill on the same sha) may have created it
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG already exists — skipping"
              continue
            fi
            VER="${TAG#v}"
            # section for this version from CHANGELOG (until the next "## " header)
            awk -v ver="$VER" '
              { if ($0 ~ "^## " ver "( |$)") { p=1; next } else if (p && $0 ~ /^## /) { exit } }
              p { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "No CHANGELOG section for $VER — using generated notes" > notes.md
            fi
            # previous tag → compare link
            PREV=$(git tag -l 'v*' --sort=version:refname | grep -B1 "^${TAG}$" | head -1 || true)
            if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
              printf '\n---\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$PREV" "$TAG" >> notes.md
            fi
            echo "creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Advarr $TAG" \
              --notes-file notes.md
          done
          # ensure "latest" points to the highest semver
          LATEST=$(git tag -l 'v*' --sort=-version:refname | head -1)
          gh release edit "$LATEST" --repo "$GITHUB_REPOSITORY" --latest || true

      - name: Nothing to do
        if: steps.plan.outputs.tags == ''
        run: echo "All tagged versions already have releases."