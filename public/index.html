<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advarr — радар трендов</title>
  <meta property="og:title" content="Advarr">
  <meta property="og:description" content="Пассивный радар трендов для твоего *arr-стека">
  <meta property="og:image" content="/og.png">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="logo" href="#/overview">
        <img src="/logo.svg" alt="Advarr" width="34" height="34">
        <span>Advarr</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/overview" data-route="overview"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 0 1 10 10h-2a8 8 0 1 0-8 8v2A10 10 0 0 1 12 2zm0 5a5 5 0 0 1 5 5h-2a3 3 0 1 0-3 3v2a5 5 0 0 1-5-5 5 5 0 0 1 5-5zm1 5.4V4h-2v8.4l-4.7-2.7-1 1.7L12 15l6.7-3.9-1-1.7L13 12.4z"/></svg><span>Обзор</span></a>
        <a href="#/discovery" data-route="discovery"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm6 4v8l6-4-6-4z"/></svg><span>Подборка</span></a>
        <a href="#/history" data-route="history"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M13 3a9 9 0 1 0 8.95 10h-2.02A7 7 0 1 1 13 5a6.96 6.96 0 0 1 4.95 2.05L15 10h7V3l-2.64 2.64A8.96 8.96 0 0 0 13 3zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8H12z"/></svg><span>История</span></a>
        <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7zm7.4-2.5c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.1-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.9 7.9 0 0 0-1.73-1L14.4 2.4a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.37 2.63c-.63.26-1.2.6-1.73 1l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64L4.6 11c-.04.33-.06.66-.06 1s.02.67.06 1l-2.1 1.65a.5.5 0 0 0-.12.64l2 3.46c.14.24.42.34.61.22l2.49-1c.53.4 1.1.74 1.73 1l.37 2.63c.04.23.25.4.5.4h4c.25 0 .46-.17.5-.4l.37-2.63a7.9 7.9 0 0 0 1.73-1l2.49 1c.23.1.47 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13z"/></svg><span>Настройки</span></a>
        <a href="#/logs" data-route="logs"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 5h16v2H4V5zm0 6h16v2H4v-2zm0 6h10v2H4v-2z"/></svg><span>Логи</span></a>
        <a href="#/about" data-route="about"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg><span>О приложении</span></a>
      </nav>
      <div class="sidebar-footer">
        <span class="ver" id="side-version">v0.1.0</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="chips" id="status-chips">
          <span class="chip chip-idle" id="chip-tmdb">TMDB: …</span>
          <span class="chip chip-idle" id="chip-seerr">Seerr: …</span>
          <span class="chip chip-time" id="chip-next">—</span>
          <span class="chip chip-running hidden" id="chip-running">⟳ идёт прогон…</span>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost" id="btn-dry">Пробный прогон</button>
          <button class="btn btn-accent" id="btn-run">▶ Запустить сейчас</button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toasts" id="toasts"></div>
  <div class="keyprompt-overlay hidden" id="keyprompt-overlay">
    <div class="modal modal-small">
      <h3>Требуется API-ключ</h3>
      <p class="muted">Сервер запущен с ADVARR_API_KEY. Введи его один раз — сохранится в localStorage.</p>
      <input type="password" id="keyprompt-input" class="input" placeholder="API-ключ">
      <div class="row-end"><button class="btn btn-accent" id="keyprompt-save">Войти</button></div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
