# Advarr — hardened compose example
# copy to docker-compose.yml, adjust, `docker compose up -d`
services:
  advarr:
    image: ghcr.io/stelgen/advarr:latest        # or build: .
    container_name: advarr
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: Europe/Moscow
      # secrets — удобнее через .env рядом с compose (см. .env.example)
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in .env}
      SEERR_URL: ${SEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      # опциональная защита веб-морды (иначе только LAN/trusted-proxy)
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-}
      # ADVARR_API_KEY: ${ADVARR_API_KEY:-}
      # за reverse-proxy: TRUST_PROXY: "1" (см. docs/REVERSE-PROXY.md)
    volumes:
      - ./data:/app/data
    # --- hardening ---
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
